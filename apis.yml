aid: pivot-bio
name: Pivot Bio
description: >-
  Pivot Bio is an agricultural biotechnology company headquartered in Berkeley,
  California with additional operations in St. Louis, Missouri. The company
  engineers naturally occurring soil microbes to fix atmospheric nitrogen on
  crop root systems, providing a biological alternative to synthetic nitrogen
  fertilizer that reduces nitrous-oxide emissions, nitrate runoff, and
  exposure to volatile fertilizer prices. Pivot Bio's product line includes
  PROVEN 40 and PROVEN G3 (corn and corn silage), RETURN (wheat and small
  grains), CERT-N (cotton), and RETAIN (sorghum). The company also operates
  N-OVATOR, an outcomes-based program that pays farmers for verified
  emissions reductions; the program reports having paid out more than $6M
  to growers since 2022 and contributing to over 1,050,000 metric tons of
  CO2e avoided. Pivot Bio was founded by Karsten Temme (CEO) and Alvin Tamsir.
  Investors include Breakthrough Energy Ventures, Temasek, DCVC, Generation
  Investment Management, Pavilion Capital, G2 Venture Partners, Bond, and
  others. Pivot Bio's product is the microbe, not an API; the company operates
  a farmer-facing Salesforce-based portal but does not publish a public
  developer API or SDK.
